<textarea id="inp" type="text" spellcheck="false" oninput="inpu=document.getElementById('inp').value;integ=toint(inpu);integpack=pack(integ);document.getElementById('ustr').textContent=inpu;document.getElementById('ustrlen').textContent=inpu.length;document.getElementById('strint').textContent=integ;document.getElementById('packed').textContent=[...integpack].map(b=>b.toString(16).padStart(2,'0')).join(' ');document.getElementById('packedlen').textContent=integpack.length;document.getElementById('saved').textContent=inpu.length-integpack.length;document.getElementById('unpacked').textContent=tostr(unpack(integpack))">Hello, World!</textarea>

<script>
    const chars='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~ \n';
    const base=BigInt(chars.length);
    const map=new Map([...chars].map((char,index)=>[char,BigInt(index)]));

    function toint(s) {
        let n=-1n;
        for (const char of [...s].reverse()) {
            n=(n+1n)*base+map.get(char);
        }
        return n;
    }

    function tostr(n) {
        const string=[];
        while (n>=0n) {
            const remainder=n%base;
            n=n/base;
            string.push(chars[Number(remainder)]);
            n-=1n;
        }
        return string.join('');
    }

    function pack(n) {
        const bitlen=n.toString(2).length;
        const bytelen=(bitlen+7)>>3;
        const bytes=new Uint8Array(bytelen);
        for (let i=bytelen-1;i>=0;i--) {
            bytes[i]=Number(n&0xffn);
            n>>=8n;
        }
        return bytes;
    }

    function unpack(b) {
        let n=0n;
        for (const byte of b) {
            n=(n<<8n)|BigInt(byte);
        }
        return n;
    }
</script>
